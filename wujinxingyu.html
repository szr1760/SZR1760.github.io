<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>无尽星域 - 可拖拽战术星图</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Microsoft Yahei,Arial,Helvetica,sans-serif}
body{
    background:#080c16;
    color:#c9d1e0;
    overflow:hidden;
    font-size:14px;
    -webkit-font-smoothing: antialiased;
}
#game{
    display:flex;
    height:100vh
}
/* 左侧面板 */
#panel{
    width:340px;
    background:#0f1624;
    border-right:1px solid #233148;
    padding:12px;
    overflow-y:auto
}
.box{
    background:#151e30;
    border:1px solid #2a3b57;
    padding:10px;
    margin-bottom:10px;
    border-radius:4px
}
h3{
    color:#73a8ff;
    margin-bottom:8px;
    border-bottom:1px solid #2a3b57;
    padding-bottom:4px
}
.resource{
    display:flex;
    justify-content:space-between;
    padding:6px 0
}
button{
    background:#254477;
    color:#fff;
    border:none;
    padding:6px 10px;
    border-radius:3px;
    cursor:pointer;
    margin:2px;
    transition:0.15s
}
button:hover{
    background:#345ca0
}
button:disabled{
    background:#222;
    color:#666;
    cursor:not-allowed
}
.danger{
    background:#772525;
}
.danger:hover{
    background:#963333
}
.save-group{
    margin-top:8px;
    display:flex;
    gap:6px
}
/* 星图容器 */
#starmap{
    flex:1;
    background:
        radial-gradient(circle at 10% 10%, rgba(30,40,60,0.8) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(20,30,50,0.6) 0%, transparent 45%),
        linear-gradient(180deg, #05070e 0%, #0a0f1c 100%);
    position:relative;
    cursor:grab;
    overflow:hidden;
}
#starmap:active{
    cursor:grabbing
}
#mapContainer{
    position:absolute;
    width:100%;
    height:100%;
}
.tactical-grid{
    position:absolute;
    inset:0;
    background-image:
        linear-gradient(rgba(30, 50, 90, 0.35) 1px, transparent 1px),
        linear-gradient(90deg, rgba(30, 50, 90, 0.35) 1px, transparent 1px);
    background-size:40px 40px;
    pointer-events:none;
    z-index:1;
}
.zone-circle{
    position:absolute;
    border:1px solid rgba(60,90,140,0.75);
    border-radius:50%;
    transform:translate(-50%,-50%);
    pointer-events:none;
    box-shadow:0 0 12px rgba(60,90,140,0.45);
    z-index:2;
}
.zone-circle.base-zone{
    border-color:rgba(40,180,110,0.8);
    box-shadow:0 0 12px rgba(40,180,110,0.45);
}
.zone-circle.enemy-zone{
    border-color:rgba(180,60,60,0.8);
    box-shadow:0 0 12px rgba(180,60,60,0.45);
}
.zone-circle.captured-zone{
    border-color:rgba(60,140,220,0.85);
    box-shadow:0 0 14px rgba(70,160,255,0.5);
}
.asteroid{
    position:absolute;
    width:8px;
    height:8px;
    background:#7c8594;
    border-radius:2px;
    transform:translate(-50%,-50%);
    box-shadow:inset -2px -2px 4px rgba(0,0,0,0.5);
    pointer-events:none;
    z-index:1;
    animation:asteroidGlow 6s infinite alternate;
}
.asteroid.large{
    width:14px;
    height:14px;
    background:#9aa5b8;
}
@keyframes asteroidGlow{
    0%{opacity:0.7;}
    100%{opacity:1;}
}
.star-node{
    width:18px;
    height:18px;
    border-radius:50%;
    background:#4078d8;
    position:absolute;
    transform:translate(-50%,-50%);
    border:2px solid #82b1ff;
    cursor:pointer;
    box-shadow:0 0 8px #4078d8;
    z-index:3;
    transition: transform 0.2s;
}
.star-node.base{
    background:#29c772;
    border-color:#53ff9e;
    box-shadow:0 0 10px #29c772;
}
.star-node.enemy{
    background:#d63b3b;
    border-color:#ff6b6b;
    box-shadow:0 0 10px #d63b3b;
}
.star-node.captured{
    background:#3b88d6;
    border-color:#72b8ff;
    box-shadow:0 0 12px #499fff;
}
.star-node.selected{
    transform:translate(-50%,-50%) scale(1.55);
    outline: 2px solid #fff;
}
.star-node:hover{
    transform:translate(-50%,-50%) scale(1.35);
}
.line{
    position:absolute;
    background:
        repeating-linear-gradient(90deg, rgba(80,120,180,0.9) 0px, rgba(80,120,180,0.9) 8px, transparent 8px, transparent 16px);
    height:2px;
    transform-origin:left center;
    z-index:2;
}
.line.enemy-line{
    background:
        repeating-linear-gradient(90deg, rgba(180,60,60,0.9) 0px, rgba(180,60,60,0.9) 8px, transparent 8px, transparent 16px);
}
.line.friendly-line{
    background:
        repeating-linear-gradient(90deg, rgba(70,190,120,0.9) 0px, rgba(70,190,120,0.9) 8px, transparent 8px, transparent 16px);
}
.fleet-dot{
    position:absolute;
    width:7px;
    height:7px;
    background:#82b1ff;
    border-radius:50%;
    box-shadow:0 0 8px #82b1ff;
    z-index:10;
    pointer-events:none;
}
#log{
    height:140px;
    overflow-y:auto;
    background:#0c1320;
    padding:8px;
    border:1px solid #2a3b57
}
.red{
    color:#ff6b6b;
}
.green{
    color:#73ff9e;
}
.blue-text{
    color:#72b8ff;
}
.orange-text{
    color:#ffb86c;
}
.purple-text{
    color:#c784ff;
}
.synth-row{
    display:flex;
    align-items:center;
    margin:4px 0;
    gap:4px;
}
/* 战力颜色样式 */
.power-danger{
    color:#ff5c5c;
}
.power-warning{
    color:#ffbc42;
}
.power-safe{
    color:#62ff8e;
}

/* ===== 弹窗容器【新增】统一管理所有消息弹窗 ===== */
#popupContainer{
    position: fixed;
    right: 16px;
    bottom: 16px;
    z-index:9999;
    display:flex;
    flex-direction:column-reverse;
    gap:8px;
    pointer-events:none;
}
.msg-popup{
    padding: 10px 14px;
    background: rgba(12,19,32,0.92);
    border:1px solid #345ca0;
    border-radius:6px;
    box-shadow: 0 0 16px rgba(60,140,220,0.35);
    max-width:420px;
    pointer-events:auto;
    animation: popupFade 2.2s ease-out forwards;
}
.event-popup{
    border-color:#b47bff;
    box-shadow: 0 0 18px #783fc066;
}
@keyframes popupFade{
    0% {opacity:0; transform:translateY(12px);}
    12% {opacity:1; transform:translateY(0px);}
    85% {opacity:1;}
    100% {opacity:0;}
}
/* 节点悬浮提示 */
.node-tooltip{
    position:absolute;
    background:rgba(12,19,32,0.94);
    border:1px solid #345ca0;
    border-radius:4px;
    padding:6px 10px;
    pointer-events:none;
    z-index:999;
    font-size:13px;
    white-space:nowrap;
    display:none;
}
</style>
</head>
<body>
<!--弹窗容器【新增】-->
<div id="popupContainer"></div>
<div id="game">
    <div id="panel">
        <div class="box">
            <h3>📦 资源</h3>
            <div class="resource">金属：<span id="metal">800</span></div>
            <div class="resource">晶体：<span id="crystal">300</span></div>
            <div class="save-group">
                <button id="saveBtn">手动存档</button>
                <button id="loadBtn">读取存档</button>
                <button id="clearBtn" class="danger">删除存档</button>
            </div>
        </div>

        <div class="box">
            <h3>🏠 基地 Lv.<span id="baseLv">1</span></h3>
            <p>每秒产出：金属+<span id="metalPer">4</span> 晶体+<span id="crystalPer">1</span></p>
            <p><span class="blue-text">占领星域加成：金属+<span id="captureMetalBonus">0</span> 晶体+<span id="captureCryBonus">0</span></span></p>
            <p style="margin:6px 0">升级消耗：<span id="upgradeCost"></span></p>
            <button id="upgradeBase">升级基地</button>
        </div>

        <div class="box">
            <h3>🌌 选中星域信息</h3>
            <p>名称：<span id="selNodeName">无</span></p>
            <p id="capturedTimerLine" class="orange-text"></p>
            <p>敌方战力：<span id="selEnemyPower">——</span></p>
            <p id="powerCompareTip"></p>
            <button id="abandonCapture" style="margin-top:6px;display:none" class="danger">主动放弃占领</button>
        </div>

        <div class="box">
            <h3>🚀 舰船编队</h3>
            <p>护卫舰：<span id="frigate">0</span> 艘</p>
            <p>巡洋舰：<span id="cruiser">0</span> 艘</p>
            <p>战列巡洋舰：<span id="bcruiser">0</span> 艘</p>
            <p>战列舰：<span id="battleship">0</span> 艘</p>
            <p>航空母舰：<span id="carrier">0</span> 艘</p>
            <p><strong>总战力：<span id="power">0</span></strong></p>
            <div style="margin-top:6px;">
                <button id="buildFrigate">建造护卫舰(400/120)</button>
            </div>
            <div class="synth-row">
                <button id="synthCruiser">2护卫舰→巡洋舰</button>
            </div>
            <div class="synth-row">
                <button id="synthBCruiser">2巡洋舰→战列巡洋舰</button>
            </div>
            <div class="synth-row">
                <button id="synthBattleship">2战列巡洋舰→战列舰</button>
            </div>
            <div class="synth-row">
                <button id="synthCarrier">2战列舰→航空母舰</button>
            </div>
        </div>

        <div class="box">
            <h3>🚀 舰队行动</h3>
            <p>选中星域节点后派遣舰队</p>
            <button id="sendFleet" disabled>派遣舰队前往目标</button>
            <p id="fleetStatus">舰队待命</p>
            <p style="font-size:12px;color:#aaa">敌方战力 = 我方战力 × 0.5 ~ 1.5随机</p>
            <p style="font-size:12px;color:#c784ff">⚠️航行途中有概率遭遇星域特殊事件</p>
        </div>

        <div class="box">
            <h3>📜 航行日志</h3>
            <div id="log"></div>
            <p style="margin-top:6px;color:#888;">操作：鼠标拖动星图 | 滚轮缩放 | +/-键缩放 | ESC取消选中</p>
        </div>
    </div>

    <div id="starmap">
        <div id="mapContainer">
            <div class="tactical-grid"></div>
            <div class="node-tooltip" id="tooltip"></div>
        </div>
    </div>
</div>

<script>
const popupContainer = document.getElementById("popupContainer");
const MAX_POP_COUNT = 6;

const defaultData = {
    metal: 800,
    crystal: 300,
    baseLv: 1,
    metalPerSec: 4,
    crystalPerSec: 1,
    frigate: 0,
    cruiser: 0,
    bcruiser: 0,
    battleship: 0,
    carrier: 0,
    selectedNode: null,
    fleetBusy: false,
    capturedNodes: {},
    nodeEnemyPower: {} // 存储每个星域固定敌方战力 {nodeId:战力数值}
}

let gameData = {};
let cachedEnemyPower = 0;

// 舰船战力配置
const shipAttr = {
    frigatePower: 120,
    cruiserMult: 3,
    bcruiserMult: 3,
    battleshipMult: 3,
    carrierMult: 3
}

//占领点基础产出
const CAPTURE_PER_SEC_METAL = 10;
const CAPTURE_PER_SEC_CRY = 3;
const MIN_RESPAWN_MIN = 5;
const MAX_RESPAWN_MIN = 15;

//敌方浮动区间
const ENEMY_FACTOR_MIN = 0.5;
const ENEMY_FACTOR_MAX = 1.5;

//==================== 星域随机事件配置 ====================
const STAR_EVENTS = [
    {
        name:"远古遗迹",
        chance:0.14,
        type:"bonus",
        desc:"舰队发现远古文明遗迹，打捞大量物资",
        metalGain:[800,1600],
        crystalGain:[300,600],
        shipLoss:0
    },
    {
        name:"流浪商船",
        chance:0.16,
        type:"bonus",
        desc:"遭遇星际流浪商船，完成交易获得资源",
        metalGain:[400,900],
        crystalGain:[200,450],
        shipLoss:0
    },
    {
        name:"离子风暴",
        chance:0.13,
        type:"danger",
        desc:"剧烈离子风暴席卷舰队，舰船受到损伤",
        metalGain:[0,0],
        crystalGain:[0,0],
        shipLoss:0.22
    },
    {
        name:"星际海盗伏击",
        chance:0.14,
        type:"danger",
        desc:"海盗舰队发起突袭，被迫交战！",
        metalGain:[150,400],
        crystalGain:[50,180],
        shipLoss:0.32
    },
    {
        name:"虚空虫洞",
        chance:0.09,
        type:"lucky",
        desc:"稳定小型虫洞！舰队快速跃迁，无任何损耗",
        metalGain:[200,500],
        crystalGain:[80,220],
        shipLoss:0
    },
    {
        name:"废弃空间站",
        chance:0.15,
        type:"bonus",
        desc:"发现废弃空间站，搜刮遗留物资",
        metalGain:[500,1100],
        crystalGain:[220,480],
        shipLoss:0
    },
    {
        name:"星际信标",
        chance:0.10,
        type:"lucky",
        desc:"古老信标引导舰队避开危险空域",
        metalGain:[300,700],
        crystalGain:[120,320],
        shipLoss:0
    },
    {
        name:"空间裂隙",
        chance:0.09,
        type:"random",
        desc:"不稳定空间裂隙，祸福未知",
        metalGain:[-300,900],
        crystalGain:[-100,350],
        shipLoss:0.18
    }
]
//航行触发事件总概率
const EVENT_TRIGGER_CHANCE = 0.42;

//随机触发星域事件
function triggerStarEvent(){
    if(Math.random() > EVENT_TRIGGER_CHANCE) return false;
    //随机抽取事件
    let roll = Math.random();
    let currentEvent = STAR_EVENTS[Math.floor(Math.random()*STAR_EVENTS.length)];

    let metalGet = Math.floor(currentEvent.metalGain[0] + Math.random()*(currentEvent.metalGain[1]-currentEvent.metalGain[0]));
    let cryGet = Math.floor(currentEvent.crystalGain[0] + Math.random()*(currentEvent.crystalGain[1]-currentEvent.crystalGain[0]));
    let lossRate = currentEvent.shipLoss;

    addLog(`<span class="purple-text">【星域特殊事件：${currentEvent.name}】${currentEvent.desc}</span>`);
    createEventPopup(`🌌星域事件：${currentEvent.name}<br>${currentEvent.desc}`);

    //资源结算
    if(metalGet !== 0 || cryGet !==0){
        gameData.metal += metalGet;
        gameData.crystal += cryGet;
        if(metalGet>0||cryGet>0){
            addLog(`<span class="green">事件收益：金属${metalGet} 晶体${cryGet}</span>`);
        }else{
            addLog(`<span class="red">空间裂隙吞噬物资！损失金属${Math.abs(metalGet)} 晶体${Math.abs(cryGet)}</span>`);
        }
    }
    //舰船损耗结算
    if(lossRate > 0){
        applyShipLoss(lossRate);
    }
    return true;
}

//创建事件专属弹窗【重构】
function createEventPopup(text){
    createPopup(text,"event-popup");
}

//通用弹窗创建函数【新增统一封装】
function createPopup(text, extraClass=""){
    //超过上限移除最早弹窗
    while(popupContainer.children.length >= MAX_POP_COUNT){
        popupContainer.firstElementChild.remove();
    }
    const popup = document.createElement("div");
    popup.className = "msg-popup " + extraClass;
    popup.innerHTML = text;
    popupContainer.appendChild(popup);
    setTimeout(()=>{
        popup.remove();
    },2600);
}

//格式化毫秒 → 分:秒
function formatMsTime(ms){
    let sec = Math.floor(ms / 1000);
    let m = Math.floor(sec / 60);
    let s = sec % 60;
    return `${m}分${s}秒`;
}

//安全计算总战力
function calcTotalPower(){
    let p = 0;
    p += Number(gameData.frigate || 0) * shipAttr.frigatePower;
    p += Number(gameData.cruiser || 0) * shipAttr.frigatePower * shipAttr.cruiserMult;
    p += Number(gameData.bcruiser || 0) * shipAttr.frigatePower * shipAttr.cruiserMult * shipAttr.bcruiserMult;
    p += Number(gameData.battleship || 0) * shipAttr.frigatePower * shipAttr.cruiserMult * shipAttr.bcruiserMult * shipAttr.battleshipMult;
    p += Number(gameData.carrier || 0) * shipAttr.frigatePower * shipAttr.cruiserMult * shipAttr.bcruiserMult * shipAttr.battleshipMult * shipAttr.carrierMult;
    if(isNaN(p)) p = 0;
    return Math.floor(p);
}

//生成动态敌方战力
function getRandomEnemyPower(ourPower){
    let factor = ENEMY_FACTOR_MIN + Math.random() * (ENEMY_FACTOR_MAX - ENEMY_FACTOR_MIN);
    return Math.floor(ourPower * factor);
}

//舰船损失处理，低级舰船优先损毁
function applyShipLoss(lossRate){
    let lossLog = [];
    //损失顺序：护卫舰→巡洋舰→战巡→战列舰→航母
    const shipList = [
        {key:"frigate", name:"护卫舰"},
        {key:"cruiser", name:"巡洋舰"},
        {key:"bcruiser", name:"战列巡洋舰"},
        {key:"battleship", name:"战列舰"},
        {key:"carrier", name:"航空母舰"}
    ];

    for(let ship of shipList){
        let count = gameData[ship.key];
        if(count <= 0) continue;
        let loseNum = Math.floor(count * lossRate * Math.random());
        loseNum = Math.min(loseNum, count);
        if(loseNum > 0){
            gameData[ship.key] -= loseNum;
            lossLog.push(`${ship.name} ×${loseNum}`);
        }
    }
    if(lossLog.length > 0){
        addLog(`<span class="red">⚠️舰船损失：${lossLog.join("、")}</span>`);
    }else{
        addLog(`<span class="green">✅本次无舰船损失</span>`);
    }
}

//计算当前所有占领星域总产出加成
function getCaptureBonus(){
    let metalBonus = 0;
    let cryBonus = 0;
    const now = Date.now();
    for(const nodeIdStr in gameData.capturedNodes){
        const refreshTime = gameData.capturedNodes[nodeIdStr];
        if(now < refreshTime){
            metalBonus += CAPTURE_PER_SEC_METAL;
            cryBonus += CAPTURE_PER_SEC_CRY;
        }
    }
    return {metalBonus, cryBonus};
}

//检查占领节点是否到期，敌军重生
function checkCapturedExpire(){
    const now = Date.now();
    let changed = false;
    for(const nodeIdStr in gameData.capturedNodes){
        const refreshTime = gameData.capturedNodes[nodeIdStr];
        if(now >= refreshTime){
            delete gameData.capturedNodes[nodeIdStr];
            //占领失效，清除保存的敌方战力，下次点击重新生成
            delete gameData.nodeEnemyPower[nodeIdStr];
            const nodeId = Number(nodeIdStr);
            const node = starNodes.find(n=>n.id === nodeId);
            if(node){
                addLog(`<span class="red">⚠️【${node.name}】敌方守军重新抵达星域！占领增益失效</span>`);
            }
            changed = true;
        }
    }
    if(changed){
        renderStarMap();
        updateUI();
        saveGame();
    }
}

//占领星域
function captureNode(node){
    //随机5~15分钟重生
    const randomMin = MIN_RESPAWN_MIN + Math.random()*(MAX_RESPAWN_MIN - MIN_RESPAWN_MIN);
    const refreshTs = Date.now() + randomMin * 60 * 1000;
    gameData.capturedNodes[node.id] = refreshTs;
    addLog(`<span class="blue-text">✅成功占领【${node.name}】！获得持续资源产出，敌军将在${Math.floor(randomMin)}分钟后返回</span>`);
    renderStarMap();
}

const starNodes = [
    {id:0,x:220,y:260,isBase:true,name:"我方基地"},
    {id:1,x:420,y:180,name:"阿尔法矿点"},
    {id:2,x:600,y:320,name:"贝塔遗迹"},
    {id:3,x:360,y:450,name:"伽马星云"},
    {id:4,x:780,y:220,name:"德尔塔空域"},
    {id:5,x:120,y:140,name:"伊普西隆前哨"},
    {id:6,x:100,y:420,name:"泽塔小行星带"},
    {id:7,x:500,y:80,name:"埃塔空间站"},
    {id:8,x:880,y:120,name:"西塔深空"},
    {id:9,x:920,y:360,name:"约塔残骸区"},
    {id:10,x:720,y:480,name:"卡帕气云"},
    {id:11,x:480,y:560,name:"拉姆达中继站"},
    {id:12,x:240,y:580,name:"缪冰巨星空域"},
    {id:13,x:60,y:300,name:"纽暗物质区"},
    {id:14,x:640,y:100,name:"克西补给空域"},

    [0,1],[0,3],[0,5],[0,6],[0,13],

    [2,4],[2,10],
    [3,11],[3,12],

const mapDom = document.getElementById("starmap");
const mapContainer = document.getElementById("mapContainer");
const tooltipDom = document.getElementById("tooltip");

let offsetX = 0, offsetY = 0;
let dragStartX, dragStartY;
let isDragging = false;
let scale = 1;
const MIN_SCALE = 0.4;
const MAX_SCALE = 2.2;
const ZOOM_STEP = 0.12;

function updateTransform(){
    mapContainer.style.transform = `translate(${offsetX}px,${offsetY}px) scale(${scale})`;
}

mapDom.addEventListener('mousedown', (e) => {
    isDragging = true;
    dragStartX = e.clientX - offsetX;
    dragStartY = e.clientY - offsetY;
    mapDom.style.cursor = "grabbing";
    tooltipDom.style.display = "none";
});
window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    offsetX = e.clientX - dragStartX;
    offsetY = e.clientY - dragStartY;
    updateTransform();
});
window.addEventListener('mouseup', () => {
    isDragging = false;
    mapDom.style.cursor = "grab";
});

mapDom.addEventListener('wheel', (e)=>{
    e.preventDefault();
    const rect = mapDom.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;
    const worldX = (mouseX - offsetX) / scale;
    const worldY = (mouseY - offsetY) / scale;
    if(e.deltaY < 0){
        scale += ZOOM_STEP;
    }else{
        scale -= ZOOM_STEP;
    }
    scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale));
    offsetX = mouseX - worldX * scale;
    offsetY = mouseY - worldY * scale;
    updateTransform();
})

document.addEventListener('keydown', (e)=>{
    if(e.key === "+" || e.key === "="){
        scale += ZOOM_STEP;
        scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale));
        updateTransform();
    }else if(e.key === "-"){
        scale -= ZOOM_STEP;
        scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale));
        updateTransform();
    }else if(e.key === "Escape"){
        //ESC清空选中
        gameData.selectedNode = null;
        cachedEnemyPower = 0;
        renderStarMap();
        updateUI();
    }
})

function saveGame(){
    localStorage.setItem("lagrange_save", JSON.stringify(gameData));
    addLog("✅ 游戏存档已保存");
}
function loadGame(){
    let saveStr = localStorage.getItem("lagrange_save");
    if(!saveStr){
        addLog("⚠️ 未找到存档！");
        return false;
    }
    try{
        const loadData = JSON.parse(saveStr);
        gameData = {...defaultData, ...loadData};
        gameData.metal = Number(gameData.metal);
        gameData.crystal = Number(gameData.crystal);
        gameData.baseLv = Number(gameData.baseLv);
        gameData.metalPerSec = Number(gameData.metalPerSec);
        gameData.crystalPerSec = Number(gameData.crystalPerSec);
        gameData.frigate = Number(gameData.frigate);
        gameData.cruiser = Number(gameData.cruiser);
        gameData.bcruiser = Number(gameData.bcruiser);
        gameData.battleship = Number(gameData.battleship);
        gameData.carrier = Number(gameData.carrier);
        if(!gameData.capturedNodes) gameData.capturedNodes = {};
        if(!gameData.nodeEnemyPower) gameData.nodeEnemyPower = {};

        updateUI();
        renderStarMap();
        addLog("✅ 存档读取成功");
        return true;
    }catch(e){
        addLog("❌ 存档损坏");
        return false;
    }
}
function clearSave(){
    localStorage.removeItem("lagrange_save");
    gameData = {...defaultData};
    cachedEnemyPower = 0;
    updateUI();
    renderStarMap();
    addLog("🗑️ 存档已清除，重置游戏");
}

function initGame(){
    let save = localStorage.getItem("lagrange_save");
    if(save){
        loadGame();
    }else{
        gameData = {...defaultData};
    }
}

function renderStarMap(){
    mapContainer.querySelectorAll(".zone-circle, .line, .star-node,.asteroid,.fleet-dot").forEach(el => el.remove());
    const asteroids = [
        {x:150,y:120,size:""},
        {x:520,y:90,size:"large"},
        {x:680,y:140,size:""},
        {x:860,y:300,size:""},
        {x:300,y:520,size:"large"},
        {x:760,y:460,size:""},
        {x:80,y:500,size:"large"},
        {x:900,y:480,size:""},
        {x:420,y:620,size:""}
    ];
    asteroids.forEach(a=>{
        const div = document.createElement("div");
        div.className = "asteroid " + a.size;
        div.style.left = a.x + "px";
        div.style.top = a.y + "px";
        mapContainer.appendChild(div);
    });
    starNodes.forEach(node=>{
        const circle = document.createElement("div");
        circle.className = "zone-circle";
        if(node.isBase) {
            circle.classList.add("base-zone");
        }else if(gameData.capturedNodes[node.id] && Date.now() < gameData.capturedNodes[node.id]){
            circle.classList.add("captured-zone");
        }else{
            circle.classList.add("enemy-zone");
        }
        circle.style.left = node.x + "px";
        circle.style.top = node.y + "px";
        circle.style.width = "70px";
        circle.style.height = "70px";
        mapContainer.appendChild(circle);
    });
    links.forEach(([a,b])=>{
        let n1 = starNodes[a], n2 = starNodes[b];
        const dx = n2.x - n1.x;
        const dy = n2.y - n1.y;
        const len = Math.hypot(dx,dy);
        const angle = Math.atan2(dy,dx)*180/Math.PI;
        const line = document.createElement("div");
        line.className = "line enemy-line";
        line.style.left = n1.x + "px";
        line.style.top = n1.y + "px";
        line.style.width = len + "px";
        line.style.transform = `rotate(${angle}deg)`;
        mapContainer.appendChild(line);
    });
    starNodes.forEach(node=>{
        const div = document.createElement("div");
        div.className = "star-node";
        if(node.isBase){
            div.classList.add("base");
        }else if(gameData.capturedNodes[node.id] && Date.now() < gameData.capturedNodes[node.id]){
            div.classList.add("captured");
        }else{
            div.classList.add("enemy");
        }
        //选中高亮
        if(gameData.selectedNode && gameData.selectedNode.id === node.id){
            div.classList.add("selected");
        }
        div.style.left = node.x + "px";
        div.style.top = node.y + "px";
        div.onclick = ()=>selectNode(node);

        //悬浮提示
        div.onmouseenter = (ev)=>{
            tooltipDom.style.display = "block";
            tooltipDom.style.left = (ev.clientX+12)+"px";
            tooltipDom.style.top = (ev.clientY+12)+"px";
            let statusText = "";
            if(node.isBase) statusText = "我方基地";
            else if(gameData.capturedNodes[node.id] && Date.now() < gameData.capturedNodes[node.id]) statusText = "✅已占领";
            else statusText = "⚠️敌方控制区";
            tooltipDom.innerHTML = `${node.name} | ${statusText}`;
        }
        div.onmousemove = (ev)=>{
            tooltipDom.style.left = (ev.clientX+12)+"px";
            tooltipDom.style.top = (ev.clientY+12)+"px";
        }
        div.onmouseleave = ()=>{
            tooltipDom.style.display = "none";
        }

        mapContainer.appendChild(div);
    });
}

function selectNode(node){
    gameData.selectedNode = node;
    let statusText = "";
    if(node.isBase){
        cachedEnemyPower = 0;
        statusText = "【我方基地】";
    }else if(gameData.capturedNodes[node.id] && Date.now() < gameData.capturedNodes[node.id]){
        statusText = "【已占领，持续产出资源】";
        cachedEnemyPower = 0;
    }else{
        //核心改动：存在记录就复用，不存在才生成新战力
        if(gameData.nodeEnemyPower[node.id] === undefined){
            gameData.nodeEnemyPower[node.id] = getRandomEnemyPower(calcTotalPower());
        }
        cachedEnemyPower = gameData.nodeEnemyPower[node.id];
        statusText = `【存在敌方舰队，战力${cachedEnemyPower}】`;
    }
    addLog(`选中星域：${node.name} ${statusText}`);
    refreshSendBtn();
    renderStarMap();
    updateUI();
}

function refreshSendBtn(){
    if(gameData.selectedNode && !gameData.selectedNode.isBase && !gameData.fleetBusy){
        document.getElementById("sendFleet").disabled = calcTotalPower() <= 0;
    }else{
        document.getElementById("sendFleet").disabled = true;
    }
}

// ===== 修改后的addLog，调用统一弹窗函数 =====
function addLog(text){
    const logDom = document.getElementById("log");
    logDom.innerHTML += "> "+text+"<br>";
    logDom.scrollTop = logDom.scrollHeight;
    createPopup(text);
}

function updateUI(){
    const bonus = getCaptureBonus();
    const ourPower = calcTotalPower();
    document.getElementById("metal").innerText = Math.floor(gameData.metal);
    document.getElementById("crystal").innerText = Math.floor(gameData.crystal);
    document.getElementById("baseLv").innerText = gameData.baseLv;
    document.getElementById("metalPer").innerText = gameData.metalPerSec;
    document.getElementById("crystalPer").innerText = gameData.crystalPerSec;
    document.getElementById("captureMetalBonus").innerText = bonus.metalBonus;
    document.getElementById("captureCryBonus").innerText = bonus.cryBonus;

    document.getElementById("frigate").innerText = gameData.frigate;
    document.getElementById("cruiser").innerText = gameData.cruiser;
    document.getElementById("bcruiser").innerText = gameData.bcruiser;
    document.getElementById("battleship").innerText = gameData.battleship;
    document.getElementById("carrier").innerText = gameData.carrier;
    document.getElementById("power").innerText = ourPower;

    //选中星域信息面板
    const selNode = gameData.selectedNode;
    document.getElementById("selNodeName").innerText = selNode ? selNode.name : "无";
    const enemyPowerDom = document.getElementById("selEnemyPower");
    const compareTipDom = document.getElementById("powerCompareTip");
    const abandonBtn = document.getElementById("abandonCapture");

    let timerHtml = "";
    let showAbandon = false;
    if(selNode && !selNode.isBase){
        const refreshTs = gameData.capturedNodes[selNode.id];
        const now = Date.now();
        if(refreshTs && now < refreshTs){
            const remain = refreshTs - now;
            timerHtml = `敌军守军刷新倒计时：${formatMsTime(remain)}`;
            showAbandon = true;
        }
    }
    abandonBtn.style.display = showAbandon ? "block" : "none";
    document.getElementById("capturedTimerLine").innerHTML = timerHtml;

    //战力颜色+对比提示逻辑
    if(cachedEnemyPower > 0){
        enemyPowerDom.innerText = cachedEnemyPower;
        let ratio = ourPower / cachedEnemyPower;
        let tipText = "";
        enemyPowerDom.className = "";
        if(ratio > 1.2){
            enemyPowerDom.className = "power-safe";
            tipText = `<span class="power-safe">我方优势，胜率较高 (战力比值:${ratio.toFixed(2)})</span>`;
        }else if(ratio >= 0.85){
            enemyPowerDom.className = "power-warning";
            tipText = `<span class="power-warning">双方势均力敌，风险较大 (战力比值:${ratio.toFixed(2)})</span>`;
        }else{
            enemyPowerDom.className = "power-danger";
            tipText = `<span class="power-danger">敌方战力更强，不建议进攻 (战力比值:${ratio.toFixed(2)})</span>`;
        }
        compareTipDom.innerHTML = tipText;
    }else{
        enemyPowerDom.innerText = "——";
        enemyPowerDom.className = "";
        compareTipDom.innerHTML = "";
    }

    //基地升级消耗
    const costM = 1200 * gameData.baseLv;
    const costC = 500 * gameData.baseLv;
    let html = "";
    if(gameData.metal >= costM){
        html += `<span class="green">金属${costM}</span>`
    }else{
        html += `<span class="red">金属${costM}</span>`
    }
    html += " ";
    if(gameData.crystal >= costC){
        html += `<span class="green">晶体${costC}</span>`
    }else{
        html += `<span class="red">晶体${costC}</span>`
    }
    document.getElementById("upgradeCost").innerHTML = html;
    refreshSendBtn();
}

//主动放弃占领
document.getElementById("abandonCapture").onclick = ()=>{
    const node = gameData.selectedNode;
    if(!node) return;
    delete gameData.capturedNodes[node.id];
    delete gameData.nodeEnemyPower[node.id];
    addLog(`<span class="orange-text">主动放弃【${node.name}】占领状态！</span>`);
    renderStarMap();
    updateUI();
    saveGame();
}

function gameLoop(){
    checkCapturedExpire();
    const bonus = getCaptureBonus();
    gameData.metal += (gameData.metalPerSec + bonus.metalBonus) / 60;
    gameData.crystal += (gameData.crystalPerSec + bonus.cryBonus) / 60;
    updateUI();
    requestAnimationFrame(gameLoop);
}

document.getElementById("upgradeBase").onclick = ()=>{
    const costM = 1200 * gameData.baseLv;
    const costC = 500 * gameData.baseLv;
    if(gameData.metal >= costM && gameData.crystal >= costC){
        gameData.metal -= costM;
        gameData.crystal -= costC;
        gameData.baseLv++;
        gameData.metalPerSec +=3;
        gameData.crystalPerSec +=1;
        addLog(`基地升级至Lv.${gameData.baseLv}！资源产出提升`);
        updateUI();
        saveGame();
    }else{
        addLog("资源不足，无法升级基地");
    }
}

//建造护卫舰
document.getElementById("buildFrigate").onclick = ()=>{

        gameData.metal -=400;
        gameData.crystal -=120;
        gameData.frigate++;
        addLog("护卫舰建造完成！");

//派遣舰队
document.getElementById("sendFleet").onclick = ()=>{
    if(!gameData.selectedNode || gameData.fleetBusy) return;
    const target = gameData.selectedNode;
    gameData.fleetBusy = true;
    document.getElementById("fleetStatus").innerText = "舰队航行中...";
    document.getElementById("sendFleet").disabled = true;
    addLog(`舰队出发前往【${target.name}】`);

    //航行光点动画
    const baseNode = starNodes.find(x=>x.isBase);
    createFleetAnim(baseNode.x,baseNode.y,target.x,target.y,6000,()=>{
        //航行结束战斗
        const ourPower = calcTotalPower();
        const enemyPower = cachedEnemyPower;
        addLog(`遭遇敌方私掠舰队！敌方战力：${enemyPower}`);
        battle(ourPower, enemyPower, target);
        gameData.fleetBusy = false;
        document.getElementById("fleetStatus").innerText = "舰队待命";
        updateUI();
        saveGame();
    });
}

//舰队移动光点动画（中途3秒触发星域事件）
function createFleetAnim(sx,sy,ex,ey,duration,finishCallback){
    const dot = document.createElement("div");
    dot.className = "fleet-dot";
    mapContainer.appendChild(dot);
    const start = Date.now();
    let eventTriggered = false;
    function animate(){
        const t = Date.now() - start;
        let p = Math.min(t/duration,1);
        let px = sx + (ex-sx)*p;
        let py = sy + (ey-sy)*p;
        dot.style.left = px+"px";
        dot.style.top = py+"px";

        //航行一半（3秒）判定触发随机星域事件
        if(p >= 0.5 && !eventTriggered){
            eventTriggered = true;
            triggerStarEvent();
            updateUI();
            saveGame();
        }

        if(p<1){
            requestAnimationFrame(animate);
        }else{
            dot.remove();
            finishCallback();
        }
    }
    animate();
}

//战斗结算
function battle(ourPower, enemyPower, targetNode){
    const ratio = ourPower / enemyPower;
    if(ratio > 1.2){
        addLog("✅ 战斗大胜！敌方舰队被击溃");
        applyShipLoss(0.15); //大胜，最多损失15%舰船
        captureNode(targetNode);
        collectResource();
    }else if(ratio >= 0.85){
        addLog("⚠️ 惨胜！舰队受到损伤");
        applyShipLoss(0.45); //惨胜，最高45%损失
        captureNode(targetNode);
        collectResource();
    }else{
        addLog(`❌ 战斗失败！舰队遭受重创，仅少量物资回收`);
        applyShipLoss(0.75); //战败最高75%舰船损毁
        collectResource(0.4);
        //【修复BUG】战斗失败不再占领星域
    }
}

function collectResource(multiplier = 1){
    const gainMetal = Math.floor((600 + Math.random()*800)*multiplier);
    const gainCry = Math.floor((200 + Math.random()*350)*multiplier);
    gameData.metal += gainMetal;
    gameData.crystal += gainCry;
    addLog(`探索完成！获得金属${gainMetal} 晶体${gainCry}`);
}

document.getElementById("saveBtn").onclick = saveGame;
document.getElementById("loadBtn").onclick = loadGame;
document.getElementById("clearBtn").onclick = clearSave;

initGame();
renderStarMap();
updateTransform();
updateUI();
gameLoop();
addLog("欢迎来到无尽星域！按住鼠标拖动星图自由移动视角");
addLog("舰船合成规则：2低级舰合成1高级舰，战力为下级3倍");
addLog("星域敌方战力首次点击固定，占领前永久不变！");
addLog("击败敌军星域可占领，持续产出资源，敌军5~15分钟后重新刷新");
addLog("⚠️舰队航行途中可能触发星域特殊事件，机遇与危险并存");
addLog("操作：鼠标滚轮缩放地图，键盘 + / - 放大缩小，ESC取消选中");
